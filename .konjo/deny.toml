# cargo-deny configuration — Konjo Quality Framework
#
# Schema reconciled against cargo-deny 0.20.2 (installed pin) during the
# kiban v1.9.0 reconciliation (Track A1). `[licenses].copyleft`/`unlicensed`
# and `[advisories].vulnerability`/`notice` were removed upstream (see
# https://github.com/EmbarkStudios/cargo-deny/pull/611) -- a crate outside
# `allow` now denies by default (no separate toggle needed), and advisory
# vulnerabilities are always denied (also no toggle). `unmaintained` changed
# from a warn/deny lint level to a scope enum (all/workspace/transitive/none).
# This file previously used the pre-611 schema throughout and `cargo deny
# check --config .konjo/deny.toml` besides was invoking `--config` in the
# wrong position (it's a top-level flag, before `check`, not a `check`
# subcommand flag) -- both bugs meant this gate had never actually run
# successfully; see LEDGER.md's soft-step triage.
[licenses]
allow = ["MIT","Apache-2.0","Apache-2.0 WITH LLVM-exception","BSD-2-Clause","BSD-3-Clause","ISC","Unicode-DFS-2016","CC0-1.0","Zlib","OpenSSL","Unicode-3.0"]
confidence-threshold = 0.8
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # bincode 1.3.3: RUSTSEC-2025-0141, "unmaintained" (governance/harassment
    # incident, not a vulnerability -- the prior maintainers explicitly call
    # 1.3.3 "a complete version ... not in need of any updates"). vectro's
    # on-disk stream/dataset format is bincode-encoded; migrating to
    # wincode/postcard is a real storage-format migration, out of scope for
    # this CI-reconnection track. Tracked in NEXT_SESSION_PROMPT.md.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is the on-disk format codec; migration is a real breaking change, tracked separately, not a CI-reconnection fix" },
    # pyo3 0.20.3: RUSTSEC-2025-0020 and RUSTSEC-2026-0177 both require a
    # major pyo3 upgrade (>=0.24.1 / >=0.29.0) to fix, which is an
    # API-breaking change across vectro_py's whole binding surface -- real
    # Rust implementation work, out of scope for this CI-reconnection track
    # (see this track's non-goals). Neither has a known exploited-in-the-wild
    # report against vectro's own usage (no raw &str-to-C-API boundary with
    # untrusted embedded NULs in vectro_py's call sites; no custom PyCFunction
    # closures shared across threads). Tracked in NEXT_SESSION_PROMPT.md as a
    # real, accepted-for-now risk, not silently dropped.
    { id = "RUSTSEC-2025-0020", reason = "requires pyo3 >=0.24.1, a breaking API upgrade across vectro_py; tracked separately, not a CI-reconnection fix" },
    { id = "RUSTSEC-2026-0177", reason = "requires pyo3 >=0.29.0, a breaking API upgrade across vectro_py; tracked separately, not a CI-reconnection fix" },
]
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
