# .konjo/profile.yml
# VECTRO's Konjo profile. The CI plane installs the pinned kiban distribution (see
# .konjo/kiban.ref and .github/workflows/konjo-gates.yml) and runs `konjo-gates` against this
# profile. The profile was reconciled against this repo's real state (Cargo.toml workspace,
# .pre-commit-config.yaml, .github/workflows/konjo-gate.yml and ci.yml, .konjo/deny.toml,
# Makefile, reproduce_paper.sh, benchmarks/, PERF_FINDINGS.md). Fields are confirmed against
# that state unless marked UNVERIFIED.
#
# VECTRO is a vector-search / ANN library: a Rust core (rust/vectro_lib) with Python bindings
# (rust/vectro_py + python/), a JS/WASM binding (js/, with TypeScript types), and a Mojo
# surface (src/vectro_mojo, experimental/mojo). It is a perf-paper repo (benchmarks/,
# reproduce_paper.sh, PERF_FINDINGS.md).

repo: vectro

# Confirmed: Cargo.toml is a workspace (vectro_lib, vectro_cli, vectro_py, generators); the
# pre-commit and konjo-gate.yml G1 run ruff/ruff-format/mypy/vulture over python/; js/ ships a
# Node binding with index.d.ts (TypeScript) and a js-ci.yml workflow; and the repo carries a
# real Mojo surface (src/vectro_mojo, experimental/mojo, Mojo tests; 38 .mojo files) with a
# Mojo IPC smoke-test in ci.yml.
stack:
  - rust
  - python
  - typescript
  - mojo

packs:
  - lang/rust
  - lang/python
  - lang/typescript
  - lang/mojo

# Confirmed from konjo-gate.yml G1 (cargo fmt --check, clippy with -D warnings -D pedantic
# -D unwrap_used -D expect_used -D panic -D todo -D dbg_macro; ruff check; ruff format --check;
# vulture) and .pre-commit-config.yaml (ruff, ruff-format, mypy on ^python/).
format_lint:
  - fmt-check
  - clippy
  - ruff
  - ruff-format
  - mypy
  - vulture

# Confirmed from konjo-gate.yml. cargo-deny reads .konjo/deny.toml; cargo-audit is the advisory
# scan; G2 is an 80% line-coverage gate (cargo llvm-cov nextest --fail-under-lines 80 and a
# pytest coverage run); G4 enforces complexity (cognitive_complexity + radon), the 500-line
# file-size limit, the dry_check.py duplicate-block gate, and rustdoc missing_docs. unsafe-budget
# is the kiban-native gate: a net rise in unsafe blocks with no safety comment fails.
contract_gates:
  - cargo-deny           # G1: cargo deny check --config .konjo/deny.toml
  - cargo-audit          # G1: advisory scan
  - coverage-80          # G2: cargo llvm-cov nextest --fail-under-lines 80, plus pytest --cov
  - complexity           # G4: cognitive_complexity (Rust) + radon (Python)
  - file-size-500        # G4: 500-line hard limit per source file
  - dry                  # G4: dry_check.py, threshold 0.85
  - rustdoc              # G4: RUSTDOCFLAGS="-D missing_docs"
  - unsafe-budget        # kiban-native, diff-only

# Confirmed from konjo-gate.yml G3: `cargo mutants --in-diff`.
mutation: cargo-mutants

# kiban-native review lanes for this stack. The Rust core carries the defect risk: the clippy
# config already bans unwrap/expect/panic (the mechanical half of error-handling), and the repo
# is perf-critical (the prove gate plus a perf paper). ownership-lifetimes, error-handling, and
# perf-alloc come from lang/rust; concurrency and api-surface are the shared _base lanes;
# type-soundness and async-correctness (lang/typescript) cover the js/ binding. red-team is
# appended automatically. The lang/python lanes are deferred (empty), so Python diffs lean on
# the contract gates above.
# Order matters: the red-team lane embeds the other lanes' findings in this order, and the
# cassette key depends on it. api-surface is listed last so that, filtered by scope, each
# language's worker sequence matches its recorded corpus order:
#   Rust diff -> [ownership-lifetimes, error-handling, perf-alloc, concurrency, api-surface]
#   TS   diff -> [type-soundness, async-correctness, api-surface]
#   Mojo diff -> [concurrency, mojo-memory, mojo-numerics, mojo-perf, api-surface]
# (concurrency and api-surface are the shared _base lanes that cover SCOPE_MOJO). The Mojo
# order matches profiles/mojo_example.yml, under which the Mojo cassettes were recorded.
# Reordering any of these would stale the cassettes.
specialists:
  - ownership-lifetimes
  - error-handling
  - perf-alloc
  - concurrency
  - mojo-memory
  - mojo-numerics
  - mojo-perf
  - type-soundness
  - async-correctness
  - api-surface

# The perf prove gate. Confirmed: VECTRO's headline metric is QPS (queries per second) for ANN
# search, higher is better, held at a fixed recall@10; the benchmarks also record throughput
# (vec/sec) and p50 latency. The paper bench is reproduce_paper.sh (also `make bench-all`),
# which writes results/paper/wave{N}_{platform}_{date}.json per run.
#
# min_effect_pct is PENDING USER CONFIRMATION, per the house rule: the "what counts as a real
# win" threshold must be measured on the bench hardware (PERF_FINDINGS.md records the reference
# host: x86_64, 4 physical cores, AVX2 + AVX-512F + FMA, target-cpu=x86-64-v3, release fat-LTO),
# not invented. Until activated, konjo-prove run refuses a verdict (NOT ACTIVATED, exit 3) and
# the CI prove gate keeps blocking perf changes; it never passes a perf change silently while
# inert.
prove:
  enabled: true
  baseline: "paper_v5_0_0"           # the v5.0.0 cross-platform paper baseline
  metric: "qps"                       # queries per second at a fixed recall@10
  unit: "qps"
  lower_is_better: false              # throughput: higher is better
  run_floor: 30
  # ACTIVATED 2026-07-05 (PR #110, HnswIndex::reorder_for_locality). Measured, not
  # invented: benchmarks/results/prove_hnsw_reorder_20260705T214815Z.json recorded
  # 35 paired raw (not best-of-N) single-query QPS passes on this bench host and
  # found baseline CoV 4.75%, candidate CoV 4.56% — consistent with the ±10-15%
  # host noise floor PERF_FINDINGS.md documents across every other campaign on
  # this same machine. 10% clears both with margin, so a future MERGE verdict
  # must exceed genuine noise on this host, not a lucky single measurement.
  min_effect_pct: 10.0
  perf_globs:
    - "rust/**"
    - "benchmarks/**"
    - "src/**"
  # Covers the INT8 quantization table specifically (the paper's original
  # headline metric) — it does not exercise HNSW, IVF, or other index paths.
  # A perf change outside int8's scope (e.g. HNSW-only work like PR #110) can't
  # get a real verdict from this command: baseline and candidate would be
  # identical because the code path under test never runs. For those, produce a
  # dedicated paired-measurement artifact (baseline_qps/candidate_qps arrays,
  # >= run_floor pairs, same host) and feed it through `lib.prove.paired_wilcoxon`
  # + `lib.prove.verdict` directly against this same min_effect_pct/run_floor/
  # alpha — see benchmarks/results/prove_hnsw_reorder_20260705T214815Z.json and
  # OPTIMIZATION_OPPORTUNITIES.md's "Campaign 4" entry for the worked example.
  bench_cmd: "./reproduce_paper.sh --wave 1 --runs 3"
  activation_checklist:
    - "DONE 2026-07-05 (PR #110): ran a dedicated paired HNSW benchmark (examples/hnsw_reorder_bench.rs's methodology, formalized in examples/hnsw_reorder_prove.rs) for 35 paired qps measurements — above the run_floor of 30 — since bench_cmd's int8 table can't exercise an HNSW-only change."
    - "DONE: recall pinned at 1.0 overlap (reorder is a proven pure relabel — see hnsw.rs's reorder_for_locality tests), so the qps comparison is at equal recall by construction."
    - "PARTIAL: thermal metadata read via /sys/class/thermal in the artifact; this sandboxed CI-adjacent host returned no thermal zones (null before/after) — the alternating baseline/candidate measurement order is the fallback fairness control (see the artifact JSON and hnsw_reorder_prove.rs)."
    - "DONE: measured CoV 4.75% (baseline) / 4.56% (candidate) — see the artifact."
    - "DONE: min_effect_pct set to 10.0, above both this run's measured CoV and PERF_FINDINGS.md's documented ±10-15% host noise floor."
    - "NOT DONE: konjo-prove baseline capture --tag paper_v5_0_0 — no golden capture exists yet for the int8 bench_cmd path; the HNSW proof above used a self-contained baseline/candidate pair instead (both measured in the same run, so no separate golden was needed for that verdict)."

killtest: true

# The longrun gate defaults to treating every *.py under benchmarks/ as a
# runnable script that must wire the resume contract. The recall-matched harness
# (benchmarks/harness/) is deliberately modular: only run.py and download.py are
# entry points; datasets/engines/protocol/report/stats/_resume are importable
# library modules, not scripts. Scope the gate to the true entry points — which
# is the gate's own stated intent ("keeps the gate off importable helpers that
# are not entry points") — so the two entry points carry the --resume/--fresh +
# Checkpoint contract (via benchmarks/harness/_resume.py wrapping konjo_longrun)
# and the library modules are not forced to fake it. The **/bench_*.py and
# scripts/train_*.py defaults are preserved.
longrun_globs:
  - "benchmarks/harness/run.py"
  - "benchmarks/harness/download.py"
  - "**/bench_*.py"
  - "scripts/train_*.py"

# Confirmed from konjo-gate.yml G2: tests run via cargo-nextest (Rust) and pytest (Python).
verify_cmd: "cargo nextest run --workspace && python -m pytest tests/ -q"

# Confirmed from konjo-gate.yml G1 (`cargo fmt --all`) and .pre-commit-config.yaml (ruff-format).
format_cmd: "cargo fmt --all && ruff format ."

# The eval corpus for this repo: the Rust and TypeScript planted-bug fixtures (VECTRO's two
# reviewed binding surfaces). Scopes the meta-gate so the VECTRO self-test runs only its own
# corpus, and the squish self-test never runs it.
eval_corpus:
  - rust
  - typescript
  - mojo

overrides: {}
