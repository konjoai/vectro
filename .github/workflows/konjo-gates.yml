# templates/repo-ci.yml
# The thin per-repo GitHub Actions workflow a consuming repo drops in. The CI plane
# installs the pinned kiban distribution and runs konjo-gates against the repo's profile.
# CI never reads ~/.konjo; the gate logic and the eval cassettes come from the installed,
# version-pinned package. The self_test gate runs the eval through the deterministic
# replay backend, so CI needs no model and no network for it.
#
# Pin KIBAN_REF to a tag or sha so a kiban change rolls out to this repo on a deliberate
# schedule, not all repos at once.

name: konjo-gates

on:
  pull_request:
  push:
    branches: [main]

env:
  # v1.1.4 still let ANSI-colored clippy output (forced by dtolnay/rust-toolchain's
  # CARGO_TERM_COLOR) and cargo's own build-progress noise ("Checking foo v0.1")
  # register as false net-new repo:clippy findings (reproduced on PR #104). Fixed in
  # konjoai/kiban#21, released as v1.1.5.
  KIBAN_REF: "v1.1.5"   # the pinned kiban ref for this repo; bump deliberately

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # konjo-gates diffs against the base ref

      # The repo:* Rust gates (fmt-check, clippy, cargo-deny, cargo-mutants)
      # shell out to `cargo <subcommand>`. kiban v1.1.1 fixed the bug where these
      # gates never actually ran the tool (see kiban#17); they now genuinely need
      # the toolchain on PATH to evaluate the diff. Provision it (with the rustfmt
      # + clippy components) and the two extra cargo subcommands — mirroring the
      # working konjo-gate.yml G1/G3.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "konjo-gates-${{ github.repository }}"

      - name: Install cargo gate tools
        run: cargo install cargo-deny cargo-mutants --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The repo:ruff / repo:ruff-format / repo:mypy / repo:vulture gates shell out
      # to these tools directly (same as the repo:* Rust gates above); mirror the
      # working konjo-gate.yml G1 install so they're on PATH instead of erroring
      # "tool not installed" the first time a PR's diff touches python/**.
      - name: Install Python gate tools
        run: pip install ruff mypy vulture --quiet

      # Install the whole kiban distribution at the pin. It ships the real engine
      # (lib, evals) with the konjo-gates entry point and the eval cassettes, so the
      # orchestrator imports one source of truth and the replay eval needs no model.
      - name: Install pinned kiban
        run: pip install "kiban @ git+https://github.com/konjoai/kiban.git@${KIBAN_REF}"

      - name: Run gates against the repo profile
        run: konjo-gates --profile .konjo/profile.yml --base "origin/${{ github.base_ref || 'main' }}"
