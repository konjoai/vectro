[package]
name = "vectro_py"
version = "8.12.0"
edition = "2021"
authors = ["Wesley Scholl <128409641+wesleyscholl@users.noreply.github.com>"]
description = "Python bindings for Vectro high-performance vector compression and search"
license = "MIT"

[dependencies]
vectro_lib = { path = "../vectro_lib", version = "8.17.0" }
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
numpy = { version = "0.20", features = ["half"] }
ndarray = "0.15"
half = "2.4"
# Sharded per-thread allocator — beats glibc arena-locking on the alloc-heavy
# HNSW concurrent build / multi-thread query paths (see vectro_lib's
# examples/alloc_bench.rs: ~1.1-1.16x build, ~1.08-1.1x concurrent query on a
# 4-core x86 host). Applies to all Rust-side allocations in the extension.
mimalloc = { version = "0.1", default-features = false }

[features]
default = []
# Pass-through to vectro_lib's Accelerate / AMX (Wave 3d, macOS only).
vectro_lib_accelerate = ["vectro_lib/vectro_lib_accelerate"]
# Diagnostic distance-eval counter pass-through (see vectro_lib). Never ship.
distcount = ["vectro_lib/distcount"]

[lib]
name = "vectro_py"
crate-type = ["cdylib"]
